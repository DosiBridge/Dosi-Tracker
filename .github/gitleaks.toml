# Secret-scan rules for the CI "Secret scan" job (.github/workflows/ci.yml). The repository is public, so any
# credential that reaches a commit must be treated as leaked: rotate it first, then rewrite nothing — fix forward.
#
# The default gitleaks rule set applies unchanged. Allowlist entries below must be narrow (path AND exact match),
# name the reason, and never cover a value that could be a real secret.

title = "Dosi Tracker gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "ProductionSecretsGuardTests: a made-up connection-string password proving the guard accepts a secret overridden by a later configuration provider. It is test data, not a credential."
condition = "AND"
paths = ['''^backend/test/Dosi\.Tracker\.Domain\.Tests/Security/ProductionSecretsGuardTests\.cs$''']
regexTarget = "match"
regexes = ['''Password=s3cr3t-from-env;''']

[[allowlists]]
description = "privacy_guards.rs: a named canary string proving the CLI refuses a password given on argv and never echoes or logs it. It is test data, not a credential."
condition = "AND"
paths = ['''^clients/linux/tests/privacy_guards\.rs$''']
regexTarget = "match"
regexes = ['''sentinel-argv-31337''']

[[allowlists]]
description = "cli_e2e_tests.rs: a named canary string proving a password given on argv is refused before it ever reaches a request or a log. It is test data, not a credential."
condition = "AND"
paths = ['''^clients/linux/tests/cli_e2e_tests\.rs$''']
regexTarget = "match"
regexes = ['''hunter2-argv-canary''']
