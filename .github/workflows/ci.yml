name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend build, tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build
        working-directory: backend
        run: dotnet build Dosi.Tracker.slnx --configuration Release

      - name: Install ReportGenerator (coverage merge)
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Test (unit + SQLite integration) with coverage
        working-directory: backend
        run: >
          dotnet test Dosi.Tracker.slnx --configuration Release --no-build
          --logger "trx" --results-directory TestResults
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # Ratcheting gate from docs/QUALITY.md §4. Merges every project's report, fails below floor.
      - name: Coverage gate (line >= 80%, branch >= 45%)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash backend/scripts/coverage-gate.sh 80 45

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/TestResults
            backend/TestResults/merged

  frontend:
    name: Frontend typecheck, lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # Fails on any error, or if warnings exceed the ratcheting cap (see docs/QUALITY.md §10).
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Vitest enforces the coverage floor itself (docs/QUALITY.md §4) — a drop fails this step.
      # The run includes unit, property, component, integration, acceptance and a11y (jest-axe) suites.
      - name: Unit/component/integration tests + coverage gate
        working-directory: frontend
        run: npm run test:coverage

      # Layering rules (dependency-cruiser) + source-constraint spec (localStorage allowlist,
      # API contract conformance, no hardcoded tenant ids, secret scan, route↔permission parity).
      - name: Architecture gate
        working-directory: frontend
        run: npm run test:arch

      # Known-vuln floor. Currently 8 high findings inherited from next@16.2.10 (sharp) — gate at
      # critical until the Next upgrade lands, then ratchet to --audit-level=high.
      - name: Dependency audit (critical = fail)
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      # Ratcheting size gate — fails on a ballooned chunk or total-JS creep (scripts/bundle-budget.mjs).
      - name: Bundle budget
        working-directory: frontend
        run: npm run build:budget

  frontend-e2e:
    name: Frontend E2E (Playwright, demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        working-directory: frontend
        run: npm run build

      # Runs every configured project: chromium (full functional + a11y), firefox/webkit (@smoke),
      # mobile (@mobile). @visual is skipped in CI: baselines are win32-local until linux baselines
      # are generated and committed from a CI run (see docs/testing/TEST_STRATEGY.md).
      - name: E2E (all projects, no visual)
        working-directory: frontend
        run: npx playwright test --grep-invert "@visual"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report

  windows-agent:
    name: Windows agent (build, lint, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/windows/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('clients/windows/Cargo.lock') }}

      - name: Build (locked to the committed Cargo.lock)
        working-directory: clients/windows
        run: cargo build --locked

      - name: Clippy
        working-directory: clients/windows
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: clients/windows
        run: cargo test --locked

      # The shippable artifact: an optimized GUI binary + a per-user installer.
      - name: Release build
        working-directory: clients/windows
        run: cargo build --locked --release

      # Versioned like the agent itself: the version in Cargo.toml.
      - name: Build installer (NSIS)
        working-directory: clients/windows/installer
        shell: pwsh
        run: |
          $version = (cargo metadata --manifest-path ../Cargo.toml --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          # Windows' version resource takes numbers only: 0.2.0-beta.1 -> 0.2.0.
          $numeric = ($version -split '[-+]')[0]
          Write-Host "Dosi Tracker $version"
          makensis /DVERSION=$version /DVERSION_NUMERIC=$numeric dosi-tracker.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dosi-tracker-windows-setup
          path: clients/windows/installer/dosi-tracker-setup-*.exe
          if-no-files-found: error

  macos-agent:
    name: macOS agent (build, test, app bundle)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        working-directory: clients/macos
        run: swift build

      # The core's tests: block math, queue, upload policy, API client, models.
      - name: Test
        working-directory: clients/macos
        run: swift test

      # The shippable artifact: a universal (arm64 + x86_64) "Dosi Tracker.app",
      # signed ad hoc with the hardened runtime, zipped. Developer ID signing and
      # notarization: see clients/macos/README.md.
      - name: App bundle
        working-directory: clients/macos
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: dosi-tracker-macos
          path: clients/macos/.build/dist/DosiTracker-*-macos.zip
          if-no-files-found: error

  linux-agent:
    name: Linux agent (build, test, diagnostics, installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/linux/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('clients/linux/Cargo.lock') }}

      - name: Build release (locked)
        working-directory: clients/linux
        run: cargo build --locked --release

      - name: Test release (locked)
        working-directory: clients/linux
        run: cargo test --locked --release

      - name: Release binary doctor (--json)
        working-directory: clients/linux
        run: |
          export HOME=$(mktemp -d)
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CONFIG_HOME="${HOME}/.config"
          ./target/release/dosi-tracker-linux doctor --json

      - name: Outbox status fail-closed (missing DB)
        working-directory: clients/linux
        run: |
          export HOME=$(mktemp -d)
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CONFIG_HOME="${HOME}/.config"
          MISSING_DB="${HOME}/missing_dosi_outbox_${RANDOM}_$$.db"
          rm -f "${MISSING_DB}"
          if ./target/release/dosi-tracker-linux outbox status --db "${MISSING_DB}" --account-id "00000000-0000-0000-0000-000000000001" --workspace-id "00000000-0000-0000-0000-000000000002" --json; then
            echo "ERROR: outbox status succeeded unexpectedly on non-existent DB"
            exit 1
          fi
          if [ -e "${MISSING_DB}" ]; then
            echo "ERROR: outbox status created the database file"
            exit 1
          fi

      - name: Installer lifecycle tests
        working-directory: clients/linux
        run: bash tests/test_installer_lifecycle.sh

