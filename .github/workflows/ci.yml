name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend build, tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build
        working-directory: backend
        run: dotnet build Dosi.Tracker.slnx --configuration Release

      - name: Install ReportGenerator (coverage merge)
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Test (unit + SQLite integration) with coverage
        working-directory: backend
        run: >
          dotnet test Dosi.Tracker.slnx --configuration Release --no-build
          --logger "trx" --results-directory TestResults
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # Ratcheting gate from docs/QUALITY.md §4. Merges every project's report, fails below floor.
      - name: Coverage gate (line >= 80%, branch >= 45%)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash backend/scripts/coverage-gate.sh 80 45

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/TestResults
            backend/TestResults/merged

  frontend:
    name: Frontend typecheck, lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # Fails on any error, or if warnings exceed the ratcheting cap (see docs/QUALITY.md §10).
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Vitest enforces the coverage floor itself (docs/QUALITY.md §4) — a drop fails this step.
      - name: Unit tests + coverage gate
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  windows-agent:
    name: Windows agent (build, lint, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/windows/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('clients/windows/Cargo.lock') }}

      - name: Build (locked to the committed Cargo.lock)
        working-directory: clients/windows
        run: cargo build --locked

      - name: Clippy
        working-directory: clients/windows
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: clients/windows
        run: cargo test --locked

      # The shippable artifact: an optimized GUI binary + a per-user installer.
      - name: Release build
        working-directory: clients/windows
        run: cargo build --locked --release

      - name: Build installer (NSIS)
        working-directory: clients/windows/installer
        run: makensis /DVERSION=0.1.0 dosi-tracker.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dosi-tracker-windows-setup
          path: clients/windows/installer/dosi-tracker-setup-*.exe

  macos-agent:
    name: macOS agent (swift build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: clients/macos
        run: swift build
