# TEMPORARY: compiler loop for the macOS lane (no Mac on the dev machine).
# Builds, tests and bundles clients/macos on both supported toolchains.
# Remove once the macOS job in ci.yml is green on these runners.
name: macos-probe

on:
  push:
    branches: ['probe/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.runner }} (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: default Xcode 16
            xcode: ''
          - runner: macos-14
            label: Xcode 15.4
            xcode: /Applications/Xcode_15.4.app
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: App bundle
        env:
          BUILD_NUMBER: '0'
        run: bash scripts/build-app.sh
