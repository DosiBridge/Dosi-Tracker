name: Mutation testing

# Mutation runs are slow, so they run nightly and on demand rather than on every PR (docs/QUALITY.md
# §6). Each runner enforces its own break threshold from its stryker config, so the job fails if the
# mutation score drops below the ratcheting floor.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  STRYKER_NET_VERSION: "4.16.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend-mutation:
    name: Backend domain mutation (Stryker.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker --version "${STRYKER_NET_VERSION}"

      - name: Mutate the Domain layer (fails below the break threshold)
        working-directory: backend/test/Dosi.Tracker.Domain.Tests
        run: dotnet stryker

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-mutation-report
          path: backend/test/Dosi.Tracker.Domain.Tests/StrykerOutput/**/reports

  frontend-mutation:
    name: Frontend logic mutation (StrykerJS)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Mutate the logic layer (fails below the break threshold)
        working-directory: frontend
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-mutation-report
          path: frontend/reports/mutation
