[package]
name = "dosi-tracker-linux"
version = "0.1.0"
edition = "2021"
description = "Headless Linux client foundation, capability diagnostics, and consent lifecycle core for Dosi-Tracker"
license = "MIT"
authors = ["DosiBridge"]

[lib]
name = "dosi_tracker_linux"
path = "src/lib.rs"

[[bin]]
name = "dosi-tracker-linux"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }
zbus = { version = "4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4" }

[dev-dependencies]
tempfile = "3"
proptest = "1"

