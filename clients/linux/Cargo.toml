[package]
name = "dosi-tracker-linux"
version = "0.1.0"
edition = "2021"
description = "Headless Linux client foundation, capability diagnostics, and consent lifecycle core for Dosi-Tracker"
license = "MIT"
authors = ["DosiBridge"]

[lib]
name = "dosi_tracker_linux"
path = "src/lib.rs"

[[bin]]
name = "dosi-tracker-linux"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
