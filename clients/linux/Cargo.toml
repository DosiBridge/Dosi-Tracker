[package]
name = "dosi-tracker-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Dosi-Tracker per-user activity agent for Linux: daemon, CLI and optional GUI"
license = "MIT"
authors = ["DosiBridge"]
default-run = "dosi-tracker"

[lib]
name = "dosi_tracker_linux"
path = "src/lib.rs"

# CLI and `daemon` subcommand.
[[bin]]
name = "dosi-tracker"
path = "src/main.rs"

# Thin egui client of the daemon.
[[bin]]
name = "dosi-tracker-gui"
path = "src/bin/dosi-tracker-gui.rs"
required-features = ["gui"]

[features]
default = ["gui", "tray"]
gui = ["dep:eframe", "dep:egui", "dep:winit"]
tray = ["dep:ksni"]
# Fakes, time-scale knob and GUI preview scenes for tests; never in release builds.
test-support = []

# Every dependency of the v1 design is declared here once, so later steps never
# edit this file or Cargo.lock.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
# TLS roots: the system store plus the bundled Mozilla roots. Verification is never disabled.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }
# Pure-Rust X11: XI2 counts, MIT-SCREEN-SAVER idle, RandR monitors, GetImage, EWMH.
x11rb = { version = "0.14", features = ["xinput", "screensaver", "randr"] }
# JPEG ladder, thumbnails, blur and the portal's PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iana-time-zone = "0.1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
rpassword = "7.5"
zeroize = "1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
toml = "0.8"
# GUI (feature `gui`): glow renderer; X11, xkbcommon, EGL and GL are dlopened, so
# release binaries link nothing beyond libc/libm/libgcc_s.
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui = { version = "0.35", optional = true }
# Direct dependency only to dlopen libwayland (winit's `wayland` alone links it).
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[target.'cfg(target_os = "linux")'.dependencies]
# READY/STATUS/STOPPING for the Type=notify user unit.
sd-notify = "0.4"
# D-Bus (Secret Service, logind, ScreenSaver, Mutter, portal, Notifications) on
# its own async-io executor plus the blocking API: no tokio reactor is needed.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# StatusNotifierItem tray (feature `tray`), on the same zbus 5 stack.
ksni = { version = "0.3", optional = true, default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"

# Packages (design 15.1/15.2). Built by `bash ci/check.sh package` from the
# release binaries plus the files packaging/build-dist.sh renders into
# target/release/dist-assets (both tools map `target/release/` to the real
# target directory). No maintainer scripts: the user unit and the desktop
# files are installed, never enabled, and nothing goes to /etc/xdg/autostart.
[package.metadata.deb]
name = "dosi-tracker"
maintainer = "DosiBridge <https://github.com/DosiBridge/Dosi-Tracker/issues>"
copyright = "DosiBridge"
section = "utils"
priority = "optional"
revision = "1"
extended-description = """Per-user agent of the Dosi Tracker team time-tracking service: a background agent (systemd user service), a command line, a tray icon and a window. It records working time and, only with the user's consent on this computer, keyboard and mouse counts, the active window, running programs and screenshots, and uploads them to the workspace's server. It never records keystrokes, the clipboard or the webcam, and never runs as root."""
depends = "$auto"
recommends = "libegl1 | libgl1, libxkbcommon-x11-0, libxcursor1, libxrandr2, libxi6, libx11-xcb1, xdg-desktop-portal, gnome-keyring | kwalletmanager | keepassxc, ca-certificates"
suggests = "gnome-shell-extension-appindicator"
assets = [
    ["target/release/dosi-tracker", "usr/bin/dosi-tracker", "755"],
    ["target/release/dosi-tracker-gui", "usr/bin/dosi-tracker-gui", "755"],
    ["target/release/dist-assets/usr/dosi-tracker.service", "usr/lib/systemd/user/dosi-tracker.service", "644"],
    ["target/release/dist-assets/usr/io.github.dosibridge.DosiTracker.desktop", "usr/share/applications/io.github.dosibridge.DosiTracker.desktop", "644"],
    ["packaging/metainfo/io.github.dosibridge.DosiTracker.metainfo.xml", "usr/share/metainfo/io.github.dosibridge.DosiTracker.metainfo.xml", "644"],
    ["packaging/icons/hicolor/scalable/apps/io.github.dosibridge.DosiTracker.svg", "usr/share/icons/hicolor/scalable/apps/io.github.dosibridge.DosiTracker.svg", "644"],
    ["packaging/icons/hicolor/16x16/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/16x16/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/22x22/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/22x22/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/24x24/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/24x24/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/32x32/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/32x32/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/48x48/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/48x48/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/64x64/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/64x64/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/128x128/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/128x128/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/256x256/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/256x256/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["packaging/icons/hicolor/512x512/apps/io.github.dosibridge.DosiTracker.png", "usr/share/icons/hicolor/512x512/apps/io.github.dosibridge.DosiTracker.png", "644"],
    ["target/release/dist-assets/completions/dosi-tracker.bash", "usr/share/bash-completion/completions/dosi-tracker", "644"],
    ["target/release/dist-assets/completions/_dosi-tracker", "usr/share/zsh/vendor-completions/_dosi-tracker", "644"],
    ["target/release/dist-assets/completions/dosi-tracker.fish", "usr/share/fish/vendor_completions.d/dosi-tracker.fish", "644"],
    ["README.md", "usr/share/doc/dosi-tracker/README.md", "644"],
    ["config.example.toml", "usr/share/doc/dosi-tracker/config.example.toml", "644"],
]

[package.metadata.generate-rpm]
name = "dosi-tracker"
release = "1"
summary = "Dosi Tracker per-user time-tracking agent (daemon, CLI, tray, window)"
description = "Per-user agent of the Dosi Tracker team time-tracking service: a background agent (systemd user service), a command line, a tray icon and a window. It records working time and, only with the user's consent on this computer, keyboard and mouse counts, the active window, running programs and screenshots, and uploads them to the workspace's server. It never records keystrokes, the clipboard or the webcam, and never runs as root."
url = "https://github.com/DosiBridge/Dosi-Tracker"
assets = [
    { source = "target/release/dosi-tracker", dest = "/usr/bin/dosi-tracker", mode = "755" },
    { source = "target/release/dosi-tracker-gui", dest = "/usr/bin/dosi-tracker-gui", mode = "755" },
    { source = "target/release/dist-assets/usr/dosi-tracker.service", dest = "/usr/lib/systemd/user/dosi-tracker.service", mode = "644" },
    { source = "target/release/dist-assets/usr/io.github.dosibridge.DosiTracker.desktop", dest = "/usr/share/applications/io.github.dosibridge.DosiTracker.desktop", mode = "644" },
    { source = "packaging/metainfo/io.github.dosibridge.DosiTracker.metainfo.xml", dest = "/usr/share/metainfo/io.github.dosibridge.DosiTracker.metainfo.xml", mode = "644" },
    { source = "packaging/icons/hicolor/scalable/apps/io.github.dosibridge.DosiTracker.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.dosibridge.DosiTracker.svg", mode = "644" },
    { source = "packaging/icons/hicolor/16x16/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/22x22/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/22x22/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/24x24/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/32x32/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/48x48/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/64x64/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/128x128/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/256x256/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "packaging/icons/hicolor/512x512/apps/io.github.dosibridge.DosiTracker.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.dosibridge.DosiTracker.png", mode = "644" },
    { source = "target/release/dist-assets/completions/dosi-tracker.bash", dest = "/usr/share/bash-completion/completions/dosi-tracker", mode = "644" },
    { source = "target/release/dist-assets/completions/_dosi-tracker", dest = "/usr/share/zsh/site-functions/_dosi-tracker", mode = "644" },
    { source = "target/release/dist-assets/completions/dosi-tracker.fish", dest = "/usr/share/fish/vendor_completions.d/dosi-tracker.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/dosi-tracker/README.md", mode = "644" },
    { source = "config.example.toml", dest = "/usr/share/doc/dosi-tracker/config.example.toml", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
mesa-libEGL = "*"
libxkbcommon-x11 = "*"
libXcursor = "*"
libXrandr = "*"
libXi = "*"
xdg-desktop-portal = "*"
gnome-keyring = "*"

# Test builds encode screenshots (JPEG ladder, thumbnail, blur) within the same
# bounded time as release builds (3 s for the capture at a block's end);
# unoptimized image code is about ten times slower and made the Xvfb harness
# flaky under load. Release builds are unaffected.
[profile.dev.package.image]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
