[package]
name = "dosi-tracker-windows"
version = "0.1.0"
edition = "2021"
description = "Dosi-Tracker background activity agent for Windows"
license = "MIT"
authors = ["DosiBridge"]

[[bin]]
name = "dosi-tracker"
path = "src/main.rs"

[dependencies]
# Async runtime (kept minimal: current-thread scheduler for low overhead)
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }

# HTTP client for syncing activity to the backend API.
# TLS roots: the Windows certificate store (corporate CAs, `dotnet dev-certs`)
# plus the bundled Mozilla roots. Verification is never disabled.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Local offline-first storage (bundled SQLite, no system dependency)
rusqlite = { version = "0.32", features = ["bundled"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Screenshots (cross-platform, uses native Win32 under the hood)
xcap = "0.0.14"

# Image encoding (PNG/JPEG) for screenshots and webcam frames
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Base64 encoding of captured images before upload
base64 = "0.22"

# The device's IANA time zone (e.g. "Asia/Dhaka"), sent with every block so
# reports can group days by the worker's own calendar. Already in the tree
# through chrono.
iana-time-zone = "0.1"

# Webcam capture
nokhwa = { version = "0.10", features = ["input-native"] }

# HMAC-SHA256 payload signing (tamper-detection on the local SQLite queue)
hmac = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }

# Error handling + logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.14"

# Desktop UI: system tray + a small native window (login, status, settings).
# Minimal feature set on purpose: the OpenGL (glow) backend instead of wgpu, and
# no Linux windowing/accessibility stacks — this is a lightweight Windows agent,
# so binary size and idle memory matter more than GPU features.
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.36.2", default-features = false }
tray-icon = "0.24.1"
# The window's native handle, to ask Windows whether it is really shown
# (already in the tree through eframe/winit — no extra download).
raw-window-handle = "0.6"

# Per-user config/credential directory resolution
dirs = "6.0.0"
tracing-appender = "0.2.5"

# Windows-specific APIs (input hooks, active window / process, autostart, DPAPI)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",     # low-level input hooks, windows, timers
    "Win32_UI_Input_KeyboardAndMouse",  # GetLastInputInfo (system idle time)
    "Win32_System_Threading",           # process image names (works for elevated apps)
    "Win32_System_SystemInformation",   # tick count, computer name
    "Win32_System_LibraryLoader",       # module handle for the input hooks
    "Win32_System_StationsAndDesktops", # is input on the hooks' desktop (not the lock screen)?
    "Win32_System_Registry",            # autostart (HKCU Run key), OS version
    "Win32_Graphics_Gdi",               # the monitor holding the foreground window
    "Win32_Graphics_Dwm",               # skip cloaked (suspended) windows
    "Win32_Security_Cryptography",      # DPAPI credential encryption
    "Win32_UI_Shell",                   # open the web dashboard / logs folder
    "Win32_UI_HiDpi",                   # size the window to the screen's work area
] }

# Stamps the version resource (FileVersion, ProductVersion, …) and the
# application manifest into dosi-tracker.exe (build.rs). Uses the Windows
# SDK's rc.exe; no runtime code.
[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
# Property-based testing for invariant-heavy logic (the offline queue).
proptest = "1"

[profile.release]
opt-level = "z"      # optimize for small binary size
lto = true           # link-time optimization
codegen-units = 1
strip = true         # strip symbols -> smaller, lower footprint
# NOTE: no `panic = "abort"` — eframe/winit rely on unwinding, and aborting on a
# panic in the UI thread would kill the tracker with no chance to flush the queue.
